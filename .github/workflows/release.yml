name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # OIDC trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: |
          for pkg in packages/*/; do
            (cd "$pkg" && npm publish --tag latest)
          done
